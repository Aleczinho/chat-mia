name: CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/chat-mia/package-lock.json

      - name: Instalar dependências da raiz
        run: npm ci

      - name: Verificar formatação
        run: npm run format:check

      - name: Instalar dependências do frontend
        working-directory: apps/chat-mia
        run: npm ci

      - name: Verificar TypeScript
        working-directory: apps/chat-mia
        run: npm run typecheck

      - name: Verificar ESLint
        working-directory: apps/chat-mia
        run: npm run lint

      - name: Gerar build do frontend
        working-directory: apps/chat-mia
        run: npm run build
